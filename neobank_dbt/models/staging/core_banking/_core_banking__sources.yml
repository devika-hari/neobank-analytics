version: 2

sources:
  - name: core_banking
    description: "Nightly export from the core banking system"
    # No database override: defaults to target.database, so dev/prod stay
    # correctly separated. schema stays a literal since RAW is the same
    # schema name in every environment -- only the database changes.
    schema: raw
    # All 6 tables land together in the same nightly batch (see raw_data/ and
    # sql/02_load_raw.sql), so they share one freshness threshold.
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 1, period: day}
      error_after: {count: 3, period: day}
    tables:
      - name: customers
        description: "Retail and SME customers. Source sends old versions for some customers."
      - name: accounts
        description: "Current, savings, credit card and loan accounts."
      - name: loans
        description: "One row per loan contract."
      - name: repayments
        description: "Instalment schedule and payments, one row per instalment."
      - name: gl_accounts
        description: "Chart of accounts."
      - name: ledger_postings
        description: "Double-entry postings. May contain duplicate and re-sent rows."